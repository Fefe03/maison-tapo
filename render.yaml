services:
  - type: web
    name: maison-tapo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TAPO_USERNAME
        sync: false
      - key: TAPO_PASSWORD
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
